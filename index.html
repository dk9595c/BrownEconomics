<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Semester</title>
    <style>
        /* Matches Scheduler App Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Huge Main Title */
        .main-title {
            color: #004a9c;
            /* Changed to clamp with larger minimum to prevent it from getting too small on mobile */
            font-size: clamp(3rem, 6vw, 4.5rem);
            margin-bottom: 10px;
            margin-top: 0;
            font-weight: 800;
            text-align: center;
            line-height: 1.1;
        }

        /* Subtitle */
        h2 {
            color: #666;
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 50px;
            font-weight: normal;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 900px;
        }

        .semester-card {
            background-color: white;
            border: 3px solid #004a9c;
            border-radius: 12px;
            
            /* --- RESPONSIVE BOX SIZING --- */
            width: 100%;
            max-width: 350px; /* Max size on Desktop */
            min-width: 220px; /* Doesn't get smaller than this */
            aspect-ratio: 7 / 6; /* Maintains shape */
            
            /* --- CONTAINER QUERY SETUP --- */
            /* This allows the text inside to size itself based on THIS box's width */
            container-type: inline-size;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            box-sizing: border-box;
            padding: 20px;
        }

        .semester-card:hover {
            background-color: #004a9c;
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }

        /* --- TEXT SCALING BASED ON BOX SIZE --- */
        /* 'cqi' stands for Container Query Inline-Size (1cqi = 1% of box width) */
        
        .semester-label {
            /* 10% of the box width. E.g. 35px at full size, 22px at min size */
            font-size: 10cqi;
            font-weight: bold;
            color: #004a9c;
            display: block;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .semester-sub {
            /* 5% of the box width */
            font-size: 5cqi;
            color: #666;
        }

        .icon {
            /* 15% of the box width */
            font-size: 15cqi;
            margin-bottom: 20px;
            display: block;
        }

        /* Hover colors */
        .semester-card:hover .semester-label,
        .semester-card:hover .semester-sub {
            color: white;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .container {
                gap: 20px;
            }
            /* On mobile, cards stack and fill width, effectively keeping them large */
        }

    </style>
</head>
<body>

    <h1 class="main-title">Faculty Scheduler</h1>
    <h2>Select Semester</h2>

    <div class="container">
        <a href="scheduler.html" class="semester-card">
            <span class="icon">🌸</span>
            <span class="semester-label">Spring</span>
            <span class="semester-sub">Schedule courses for Spring</span>
        </a>

        <a href="scheduler_2.html" class="semester-card">
            <span class="icon">🍂</span>
            <span class="semester-label">Fall</span>
            <span class="semester-sub">Schedule courses for Fall</span>
        </a>
    </div>

</body>
</html>
